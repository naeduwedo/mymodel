name: Packaging

# Builds the Linux packages that packaging/linux/nfpm.yaml describes.
#
# The work is done by packaging/linux/build-packages.sh, not by this file. That
# script resolves the version (writing a generated nfpm config, because
# {{ .Env.VERSION }} leaks into the artefact name), builds the GTK4 shell the
# desktop entry points at, and verifies the .deb file list. An earlier version of
# this workflow called nfpm directly and drifted from the script: it set no
# version and never built the shell, so packaging failed on every push.

on:
  push:
    branches: [main]
    paths:
      - 'packaging/linux/**'
      - 'platforms/linux/**'
      - 'crates/**'
      - 'apps/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/package-linux.yml'
  pull_request:
    paths:
      - 'packaging/linux/**'
      - 'platforms/linux/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  deb-rpm:
    name: deb + rpm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install the GTK4 headers and nfpm
        # GTK is not optional: the package ships the shell, and the shell links
        # against the system GTK.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev pkg-config
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Build both packages
        # One script, the same one README.md tells a human to run. It builds the
        # release binaries, the GTK shell, both packages, and fails if the .deb
        # is missing any expected file.
        run: bash packaging/linux/build-packages.sh

      - name: Verify the .rpm file list
        run: |
          rpm="$(ls dist/*.rpm)"
          rpm -qlp "$rpm" > rpm-contents.txt || sudo apt-get install -y rpm
          rpm -qlp "$rpm" > rpm-contents.txt
          cat rpm-contents.txt
          for expected in \
            /usr/lib/gguf-ai-engine/gguf-core \
            /usr/lib/gguf-ai-engine/gguf \
            /usr/lib/gguf-ai-engine/gguf-worker \
            /usr/lib/gguf-ai-engine/gguf-ai-engine-ui \
            /usr/bin/gguf
          do
            grep -qF "$expected" rpm-contents.txt || {
              echo "missing from the package: $expected"
              exit 1
            }
          done

      - name: Install and run the CLI
        # The real test: install the package and use it. A package that lists the
        # right files but does not run is not packaged correctly.
        run: |
          sudo dpkg -i dist/*.deb
          gguf version --json
          gguf doctor --data-dir "$RUNNER_TEMP/gguf-data" || true

      - name: Removing the package keeps user data
        run: |
          data="$HOME/.local/share/gguf-ai-engine"
          mkdir -p "$data/models"
          echo "pretend this is a 40 GB model" > "$data/models/model.gguf"
          sudo dpkg -r gguf-ai-engine
          test -f "$data/models/model.gguf" || {
            echo "uninstalling deleted user data - this is a regression"
            exit 1
          }
          echo "user data survived the uninstall, as required"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*.deb
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages-rpm
          path: dist/*.rpm
          retention-days: 7
