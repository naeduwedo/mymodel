syntax = "proto3";
package gguf.v1;

// Package-level metadata shared by every service (spec §3.2, §9.2).

message Empty {}

// Error codes are stable identifiers; the message is for humans and may change.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_NOT_FOUND = 2;
  ERROR_CODE_UNAVAILABLE = 3;
  ERROR_CODE_UNIMPLEMENTED = 4;
  ERROR_CODE_RESOURCE_EXHAUSTED = 5;
  ERROR_CODE_PERMISSION_DENIED = 6;
  ERROR_CODE_INTERNAL = 7;
}

message Status {
  bool ok = 1;
  ErrorCode code = 2;
  string message = 3;
}

// Capability status per spec §8.1: "unknown" must never be coerced to a bool.
enum CapabilityStatus {
  CAPABILITY_STATUS_UNSPECIFIED = 0;
  CAPABILITY_STATUS_SUPPORTED = 1;
  CAPABILITY_STATUS_UNSUPPORTED = 2;
  CAPABILITY_STATUS_EXPERIMENTAL = 3;
  CAPABILITY_STATUS_UNKNOWN = 4;
  // Implemented by a future task; reported so clients can explain "not yet"
  // instead of pretending the feature is missing on this hardware.
  CAPABILITY_STATUS_PLANNED = 5;
}

// Core lifecycle state (spec §3.3).
enum CoreState {
  CORE_STATE_UNSPECIFIED = 0;
  CORE_STATE_STOPPED = 1;
  CORE_STATE_STARTING = 2;
  CORE_STATE_READY = 3;
  CORE_STATE_DEGRADED = 4;
  CORE_STATE_SHUTTING_DOWN = 5;
}

message Feature {
  string id = 1;
  CapabilityStatus status = 2;
  // Human readable explanation when status is not SUPPORTED.
  string reason = 3;
}

// Client handshake; must be the first call on a connection (spec §3.2).
message HandshakeRequest {
  uint32 protocol_version = 1;
  string client = 2;
  string client_version = 3;
}

message HandshakeResponse {
  uint32 protocol_version = 1;
  string core_version = 2;
  bool accepted = 3;
  string reason = 4;
  repeated Feature features = 5;
  string instance_id = 6;
  uint32 pid = 7;
}
