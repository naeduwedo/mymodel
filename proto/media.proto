syntax = "proto3";
package gguf.v1;

// Non-LLM media services (spec §2.3, §17 Task 8).
//
// These carry bytes rather than URLs because the caller is a local shell and the
// files live on the same machine: a temporary path the shell had to clean up
// would be more moving parts for no benefit.

message ImageRequest {
  string prompt = 1;
  optional string negative_prompt = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint32 steps = 5;
  optional int64 seed = 6;
}

message ImageReply {
  // PNG bytes.
  bytes png = 1;
  uint32 width = 2;
  uint32 height = 3;
}

message VideoRequest {
  string prompt = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 frames = 4;
  uint32 fps = 5;
  optional int64 seed = 6;
  // Sampling steps. 0 lets the runtime choose its default, which is slow.
  uint32 steps = 7;
}

message VideoReply {
  // Encoded container bytes (mp4 or webm, whichever the runtime produced).
  bytes video = 1;
  string mime_type = 2;
  uint32 frames = 3;
}

// One step of a video render.
//
// A clip takes minutes, so the call streams rather than blocking: a spinner with
// no information looks the same whether the runtime is working or hung.
message VideoProgressEvent {
  // queued | running | completed | failed | cancelled
  string status = 1;
  // Stage within the job, e.g. "denoise", "encoding".
  string stage = 2;
  // Free-form detail from the runtime.
  string detail = 3;
  // Units done in this stage, when the runtime counts them.
  optional uint32 completed = 4;
  // Units in this stage, when the runtime knows them.
  optional uint32 total = 5;
  // What the units are, e.g. "steps".
  optional string unit = 6;
  // Whole-job elapsed milliseconds.
  uint64 elapsed_ms = 7;
  // Place in the queue while waiting; 0 when running.
  uint32 queue_position = 8;
  // Set only on the final event, which always ends the stream.
  optional VideoReply clip = 9;
  // Set only when the job failed.
  optional string error = 10;
}

message SpeechRequest {
  string text = 1;
}

message SpeechReply {
  // WAV bytes.
  bytes wav = 1;
}

message TranscriptionRequest {
  // The audio file's bytes.
  bytes audio = 1;
  // Original file name; the extension tells the runtime the container.
  string filename = 2;
  optional string language = 3;
}

message TranscriptionReply {
  string text = 1;
}

message MusicRequest {
  // What to generate, in English - the model's prompt language.
  string prompt = 1;
  // Length in seconds.
  uint32 duration_seconds = 2;
}

message MusicReply {
  // WAV bytes.
  bytes wav = 1;
  uint32 sample_rate = 2;
  uint32 channels = 3;
}

service MediaService {
  // Image generation. FAILED_PRECONDITION when no diffusion runtime is available.
  rpc GenerateImage(ImageRequest) returns (ImageReply);
  // Video generation. Minutes, not seconds, so it streams progress and ends with
  // the clip (or an error).
  rpc GenerateVideo(VideoRequest) returns (stream VideoProgressEvent);
  // Speech synthesis.
  rpc Synthesise(SpeechRequest) returns (SpeechReply);
  // Speech recognition.
  rpc Transcribe(TranscriptionRequest) returns (TranscriptionReply);
  // Music or sound-effect generation. Seconds to a couple of minutes.
  rpc GenerateMusic(MusicRequest) returns (MusicReply);
}