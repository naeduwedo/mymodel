syntax = "proto3";
package gguf.v1;

import "common.proto";

// Model registry and hub (spec §7, Task 5).

message ModelFile {
  string path = 1;
  string role = 2;
  bool required = 3;
  uint64 size_bytes = 4;
  optional string sha256 = 5;
}

message ModelManifest {
  uint32 schema_version = 1;
  string model_id = 2;
  string revision = 3;
  string architecture = 4;
  repeated string modalities = 5;
  string format = 6;
  repeated ModelFile files = 7;
  repeated string runtime_requirements = 8;
  repeated string components = 9;
  optional string license = 10;
}

// Compatibility state per spec §7.4.
enum CompatibilityState {
  COMPATIBILITY_STATE_UNSPECIFIED = 0;
  COMPATIBILITY_STATE_SUPPORTED = 1;
  COMPATIBILITY_STATE_COMPATIBLE_UNVERIFIED = 2;
  COMPATIBILITY_STATE_MISSING_COMPONENTS = 3;
  COMPATIBILITY_STATE_UNSUPPORTED_ARCHITECTURE = 4;
  COMPATIBILITY_STATE_UNSUPPORTED_BACKEND = 5;
  COMPATIBILITY_STATE_INSUFFICIENT_RESOURCES = 6;
  COMPATIBILITY_STATE_UNKNOWN = 7;
}

message ListModelsRequest {
  uint32 limit = 1;
  uint32 offset = 2;
}

message ListModelsResponse {
  repeated ModelManifest models = 1;
  uint32 total = 2;
}

service ModelService {
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc GetModel(GetModelRequest) returns (ModelManifest);
}

message GetModelRequest {
  string model_id = 1;
}
